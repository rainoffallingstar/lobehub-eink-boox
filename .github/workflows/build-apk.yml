name: Build BOOX Leaf5C APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already ship with Android cmdline-tools.
      # The android-actions/setup-android@v3 action currently attempts to
      # install the retired "tools" SDK package, failing before compilation.
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify ABI-independent APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          if unzip -Z1 "$apk" | grep -Eq '^lib/.*\.so$'; then
            echo "Unexpected native .so library" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/LobeHub-EInk-Leaf5C-debug.apk
          sha256sum dist/LobeHub-EInk-Leaf5C-debug.apk > dist/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E '^(package:|sdkVersion:|targetSdkVersion:)' | tee dist/apk-info.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LobeHub-EInk-Leaf5C-APK
          path: dist/*
          retention-days: 30
          if-no-files-found: error
